[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-clean-api"
version = "0.1.0"
description = "FastAPI application with Pydantic v2, strict validation, and dependency injection"
requires-python = ">=3.9"
dependencies = [
    "fastapi[standard]>=0.104",  # FastAPI with standard backend (uvicorn, etc)
    "pydantic[email]==2.*",       # Pydantic v2 for type validation and email checks
    "loguru>=0.7.0",             # Structured logging framework
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",               # Testing framework
    "httpx>=0.26",              # Async HTTP client for testing
]

